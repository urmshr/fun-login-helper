<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>FUN Login Helper</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 300px;
        padding: 16px;
        color: #121212;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic Pro', 'Noto Sans JP', 'Segoe UI',
          Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      h1 {
        font-size: 16px;
        margin-bottom: 12px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 40px;
        padding: 1px;
        border: 1px solid #767676;
        border-radius: 999px;
        background: #fff;
      }

      .switch::before {
        content: '';
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #767676;
        transform: scale(calc(2 / 3));
        transition:
          transform 0.15s ease-out,
          margin 0.15s ease-out;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch svg {
        position: absolute;
        top: 1px;
        left: 1px;
        display: none;
        pointer-events: none;
      }

      .switch:has(:checked) {
        border-color: #121212;
        background: #121212;
      }

      .switch:has(:checked)::before {
        margin-left: 16px;
        background: #fff;
        transform: none;
      }

      .switch input:checked ~ svg {
        display: block;
      }

      .switch:has(:focus-visible) {
        outline: 2px solid #121212;
        outline-offset: 2px;
      }

      #resetBlock {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid #767676;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      #resetBlock:hover {
        background: #f5f5f5;
      }

      .status {
        display: none;
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
      }

      .status.show {
        display: block;
      }

      .status.success {
        background: #f2f2f2;
      }

      .status.error {
        background: #fdecec;
      }

      .note {
        margin-top: 14px;
        font-size: 12px;
      }

      .meta-info {
        margin-top: 10px;
        font-size: 12px;
      }

      .meta-info a {
        color: #666;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .meta-info a:hover {
        text-decoration-thickness: 2px;
      }
    </style>
  </head>
  <body>
    <h1>FUN Login Helper</h1>

    <div class="toggle-row">
      <label for="enableToggle">ログイン補助を有効にする</label>
      <span class="switch">
        <input type="checkbox" role="switch" id="enableToggle" />
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M4.5 10 7.25 12.75 12 6.75"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>

    <div id="status" class="status" role="status"></div>
    <button type="button" id="resetBlock" hidden>ログイン制限を解除</button>

    <p class="note">大学非公式の拡張機能です。MIT ライセンスで提供しており無保証です。</p>

    <p class="meta-info">
      <a href="https://github.com/urmshr/fun-login-helper" target="_blank" rel="noopener noreferrer"
        >GitHub</a
      >
    </p>

    <script src="popup.js"></script>
  </body>
</html>
